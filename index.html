<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Inc.</title>
  <meta name="description" content="All Inc. — All Inc. Audio Ab, Porvoo, Finland and US & All Inc., Palo Alto, California.">
  <link rel="canonical" href="https://allinc.fi/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23111'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #6b6b6b;
      --rule: #e6e6e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e0e;
        --fg: #f2f2f2;
        --muted: #8a8a8a;
        --rule: #232323;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: 32px 24px;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(56px, 12vw, 160px);
      letter-spacing: -0.03em;
      line-height: 1;
    }
    h1 span { font-style: italic; }
    p.tag {
      margin: 20px 0 0;
      font-size: clamp(16px, 1.6vw, 20px);
      color: var(--muted);
      font-style: italic;
    }
    footer {
      border-top: 1px solid var(--rule);
      padding-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }
    footer address { font-style: normal; }
    footer strong { color: var(--fg); font-weight: 400; display: block; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    footer .note { grid-column: 1 / -1; font-size: 12px; }
    @media (max-width: 480px) {
      footer { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>All <span>Inc.</span></h1>
      <p class="tag">Porvoo &middot; Palo Alto</p>
    </div>
  </main>
  <footer>
    <address>
      <strong>All Inc. Audio Ab</strong>
      Urakoitsijantie 15<br>
      Porvoo, Uusimaa<br>
      Finland
    </address>
    <address>
      <strong>US &amp; All Inc.</strong>
      470 Ramona St<br>
      Palo Alto, California<br>
      United States
    </address>
    <div class="note">&copy; 2026 All Inc. &middot; <a href="https://allinc.fi">allinc.fi</a></div>
  </footer>
</body>
</html>
