<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>newsroom — all inc.</title>
<meta name="description" content="News from all inc.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://allinc.fi/newsroom/">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root {
  color-scheme: light dark;
  --bg: #f2f2f7; --card: #ffffff; --label: #000000; --label2: rgba(60, 60, 67, .68); --label3: rgba(60, 60, 67, .36);
  --sep: rgba(60, 60, 67, .18); --fill: rgba(120, 120, 128, .14); --fill2: rgba(120, 120, 128, .22);
  --blue: #007aff; --red: #ff3b30; --green: #1f8a3b; --sheet: #f2f2f7;
  --m: clamp(20px, 5vw, 44px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --label: #ffffff; --label2: rgba(235, 235, 245, .64); --label3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .6); --fill: rgba(120, 120, 128, .26); --fill2: rgba(120, 120, 128, .38);
    --blue: #0a84ff; --red: #ff453a; --green: #30d158; --sheet: #1c1c1e;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--label); text-transform: lowercase;
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; text-transform: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 var(--m); }

header.bar { display: flex; justify-content: space-between; align-items: center; height: 56px; font-size: 15px; }
.bar .wordmark { font-weight: 600; padding: 10px 0; }
.bar span { color: var(--label2); }

.opener { padding: clamp(36px, 9vw, 96px) 0 clamp(36px, 7vw, 72px); }
h1 { margin: 0; font-size: clamp(32px, 6.4vw, 56px); line-height: 1.06; font-weight: 700; letter-spacing: -0.035em; text-wrap: balance; }
.lines { margin: clamp(22px, 3.4vw, 36px) 0 0; padding: 0; list-style: none; }
.lines li { font-size: clamp(18px, 2.9vw, 26px); line-height: 1.22; font-weight: 600; letter-spacing: -0.022em; color: var(--label2); }
.lines li + li { margin-top: 6px; }

.opener { padding-bottom: clamp(28px, 5vw, 56px); }
footer { margin-top: 0; padding: 22px 0 28px; display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--label2); border-top: 1px solid var(--sep); }
footer span { text-transform: none; }
footer a:hover { text-decoration: underline; }
.news { margin: 0; padding: 0; list-style: none; }
.news li { padding: 22px 0 26px; border-top: 1px solid var(--sep); }
.news time { display: block; font-size: 13px; color: var(--label2); text-transform: none; font-variant-numeric: tabular-nums; }
.news h2 { margin: 8px 0 0; font-size: clamp(22px, 3.2vw, 28px); line-height: 1.14; font-weight: 700; letter-spacing: -0.028em; }
.news p { margin: 8px 0 0; max-width: 34em; font-size: 17px; line-height: 1.42; color: var(--label2); }
.news a { color: var(--blue); }
.news a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="wordmark" href="/">all inc.</a>
    <span>newsroom</span>
  </header>

  <main>
    <section class="opener"><h1>newsroom</h1></section>
    <ol class="news" reversed>
      <li>
        <article>
          <time datetime="2026-11-11">11 November 2026</time>
          <h2>four tools, free in the browser</h2>
          <p>key &amp; bpm, tuner, metronome and stage timer are now at <a href="/tools/">allinc.fi/tools</a>. no account, and nothing is uploaded.</p>
        </article>
      </li>
    </ol>
  </main>

  <footer>
    <span>© 2027 all inc. 470 Ramona St, Palo Alto</span>
    <a href="/">all inc.</a>
    <a href="/tools/">tools</a>
    <a href="/privacy/">privacy</a>
  </footer>
</div>
</body>
</html>
