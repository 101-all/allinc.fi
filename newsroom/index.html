<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>newsroom — all inc.</title>
<meta name="description" content="News from all inc.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e2e3e5">
<link rel="canonical" href="https://allinc.fi/newsroom/">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preload" href="/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: Inter; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/inter.woff2) format('woff2'); }
:root { --ink: #1d1d1f; --ink2: #505155; --fg: #f5f5f7; --muted: #8e8e8e; --soft: #1c1c1c; --blue: #2f6bff; --m: clamp(20px, 4.4vw, 60px); }
* { box-sizing: border-box; }
html { background: #d8d9db; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh; color: var(--ink); text-transform: lowercase;
  background: linear-gradient(180deg, #e4e5e7 0, #d8d9db 60vh, #cbccd0 100%);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) calc(env(safe-area-inset-right) + var(--m)) calc(env(safe-area-inset-bottom) + var(--m)) calc(env(safe-area-inset-left) + var(--m));
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; text-transform: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 6px; }
header { display: flex; align-items: center; height: 68px; }
.wordmark { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; padding: 8px 0; }
h1 { margin: 0; padding: clamp(28px, 7vw, 96px) 0 clamp(32px, 5vw, 64px); max-width: 15em; font-size: clamp(34px, 5.5vw, 92px); line-height: .98; font-weight: 700; letter-spacing: -0.048em; text-wrap: balance; }

h1 { padding-bottom: clamp(28px, 4vw, 56px); font-size: clamp(60px, 8.6vw, 140px); line-height: .9; letter-spacing: -0.06em; }
.news { margin: 0; padding: 0; list-style: none; max-width: 860px; }
.news li { padding: 22px 0 30px; border-top: 1px solid rgba(29, 29, 31, .22); }
.news time { display: block; font-size: 14px; font-weight: 500; color: var(--ink2); text-transform: none; font-variant-numeric: tabular-nums; }
.news h2 { margin: 10px 0 0; font-size: clamp(26px, 3.4vw, 44px); line-height: 1.02; font-weight: 700; letter-spacing: -0.04em; }
.news p { margin: 10px 0 0; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.4; font-weight: 500; }
.news a { border-bottom: 1px solid currentColor; }
</style>
</head>
<body>
<header><a class="wordmark" href="/">all inc.</a></header>
<main>
  <h1>newsroom</h1>
  <ol class="news" reversed>
    <li>
      <article>
        <time datetime="2026-11-11">11 November 2026</time>
        <h2>key &amp; bpm, tuner, metronome, stage timer.</h2>
        <p><a href="/tools/">allinc.fi/tools</a></p>
      </article>
    </li>
  </ol>
</main>
</body>
</html>
