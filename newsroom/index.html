<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>newsroom — all inc.</title>
<meta name="description" content="News from all inc.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://allinc.fi/newsroom/">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preload" href="/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: Inter; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/inter.woff2) format('woff2'); }
:root { --ink: #ffffff; --ink2: #8e8e8e; --fg: #ffffff; --muted: #8e8e8e; --soft: #1c1c1c; --surface: #000; --hair: rgba(255, 255, 255, .14); --blue: #2f6bff; --m: clamp(20px, 4.4vw, 60px); }
* { box-sizing: border-box; }
html { background: #000; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh; color: var(--ink); text-transform: lowercase;
  background: #000;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) calc(env(safe-area-inset-right) + var(--m)) calc(env(safe-area-inset-bottom) + var(--m)) calc(env(safe-area-inset-left) + var(--m));
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; text-transform: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 6px; }
header { display: flex; align-items: center; height: 58px; }
.wordmark { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; padding: 8px 0; }
main { max-width: 560px; }
h1 { margin: 0; padding: clamp(28px, 7vw, 72px) 0 28px; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }

.news { margin: 0; padding: 0; list-style: none; max-width: 860px; }
.news li { padding: 16px 0 20px; border-top: .5px solid var(--hair); }
.news time { display: block; font-size: 12.5px; font-weight: 400; color: rgba(255, 255, 255, .6); text-transform: none; font-variant-numeric: tabular-nums; }
.news h2 { margin: 6px 0 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
.news p { margin: 6px 0 0; font-size: 15px; line-height: 1.4; font-weight: 400; color: rgba(255, 255, 255, .9); }
.news a { border-bottom: .5px solid rgba(255, 255, 255, .6); }
</style>
</head>
<body>
<header><a class="wordmark" href="/">all inc.</a></header>
<main>
  <h1>newsroom</h1>
  <ol class="news" reversed>
    <li>
      <article>
        <time datetime="2026-11-11">11 November 2026</time>
        <h2>key &amp; bpm, tuner, metronome, stage timer.</h2>
        <p><a href="/tools/">allinc.fi/tools</a></p>
      </article>
    </li>
  </ol>
</main>
</body>
</html>
