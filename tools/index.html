<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tools — all inc.</title>
<meta name="description" content="key &amp; bpm, tuner, metronome and stage timer from all inc.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://allinc.fi/tools/">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preload" href="/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: Inter; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/inter.woff2) format('woff2'); }
:root { --ink: #ffffff; --ink2: #8e8e8e; --fg: #ffffff; --muted: #8e8e8e; --soft: #1c1c1c; --surface: #000; --hair: rgba(255, 255, 255, .14); --blue: #2f6bff; --m: clamp(20px, 4.4vw, 60px); }
* { box-sizing: border-box; }
html { background: #000; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh; color: var(--ink); text-transform: lowercase;
  background: #000;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) calc(env(safe-area-inset-right) + var(--m)) calc(env(safe-area-inset-bottom) + var(--m)) calc(env(safe-area-inset-left) + var(--m));
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; text-transform: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 6px; }
header { display: flex; align-items: center; height: 58px; }
.wordmark { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; padding: 8px 0; }
main { max-width: 560px; }
h1 { margin: 0; padding: clamp(28px, 7vw, 72px) 0 28px; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }

/* four tiles in the page's own tone */
.tiles { margin: 0; padding: 0; list-style: none; border-bottom: .5px solid var(--hair); }
.tiles button {
  width: 100%; padding: 16px 0 17px; border-top: .5px solid var(--hair); text-align: left;
  color: var(--fg); display: block;
  background: none;
  transition: transform .25s cubic-bezier(.2, .7, .2, 1), background .25s;
}
@media (hover: hover) { .tiles button:hover span { color: #fff; } }
.tiles button:active { opacity: .7; }
.tiles button:focus-visible { outline-offset: 3px; border-radius: 6px; }
.tiles b { display: block; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
.tiles span { display: block; margin-top: 4px; font-size: 15px; line-height: 1.4; font-weight: 400; color: rgba(255, 255, 255, .9); transition: color .2s; }

/* a tool opens in its own display */
dialog { color: var(--fg); background: var(--surface); border: 0; padding: 0; width: min(100vw - 24px, 460px); max-width: none; max-height: none; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px var(--hair), 0 40px 90px rgba(0, 0, 0, .6); }
dialog::backdrop { background: rgba(4, 4, 5, .6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
dialog[open] { animation: up .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes up { from { transform: translateY(18px) scale(.98); opacity: 0; } }
.bar { display: flex; justify-content: space-between; align-items: center; height: 60px; padding: 0 10px 0 24px; }
.bar strong { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.bar button { height: 44px; padding: 0 14px; font-size: 15px; font-weight: 500; color: var(--muted); border-radius: 10px; }
.bar button:hover { color: var(--fg); }
#stage { background: var(--surface); padding: 8px 24px calc(34px + env(safe-area-inset-bottom)); min-height: 360px; display: grid; place-items: center; }
@media (max-width: 599px) { dialog { margin: auto auto 8px; } }

/* the tools' own parts, as in the toolbox */
.tool { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; justify-items: center; text-align: center; font-size: 14px; }
.tool p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
.nc { text-transform: none; }
.big { font-size: clamp(56px, 17vw, 92px); font-weight: 600; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pair { display: flex; gap: clamp(28px, 8vw, 72px); align-items: flex-end; }
.keys { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.key { display: inline-flex; align-items: center; justify-content: center; height: 44px; min-width: 44px; padding: 0 16px; border-radius: 12px; background: var(--soft); color: #fff; font-weight: 500; font-size: 15px; transition: background .15s, color .15s; cursor: pointer; }
.key:active { background: #2e2e32; }
.key.on, .key[aria-pressed="true"] { background: #fff; color: #000; }
.pick { position: relative; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.pick:focus-within { outline: 2px solid var(--blue); outline-offset: 3px; }
.meter { position: relative; width: min(100%, 300px); height: 26px; }
.meter::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #fff; }
.meter::after { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 1px; background: rgba(255, 255, 255, .35); }
.meter i { position: absolute; z-index: 1; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--blue); transform: translateX(var(--x, 0px)); transition: transform .09s linear, opacity .2s; }
.beats { display: flex; gap: 10px; height: 12px; }
.beats i { width: 12px; height: 12px; border-radius: 50%; background: var(--soft); }
.beats i.on { background: var(--blue); }
#stage:fullscreen { padding: 4vh 4vw; }
#stage:fullscreen .big { font-size: min(24vw, 42vh); }
@media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } .tiles button, .key { transition: none; } }
</style>
</head>
<body>
<header><a class="wordmark" href="/">all inc.</a></header>

<main>
  <h1>all inc. is founded by artists, producers and creatives who have found their own way to make it work.</h1>
  <ul class="tiles">
    <li><button type="button" data-tool="key" data-name="key &amp; bpm"><b>key &amp; bpm</b><span>the key and bpm of an audio file.</span></button></li>
    <li><button type="button" data-tool="tuner" data-name="tuner"><b>tuner</b><span>the note, in hz and cents.</span></button></li>
    <li><button type="button" data-tool="metronome" data-name="metronome"><b>metronome</b><span>30 to 300 bpm, or tap it.</span></button></li>
    <li><button type="button" data-tool="timer" data-name="stage timer"><b>stage timer</b><span>counts the set down, then how far over.</span></button></li>
  </ul>
</main>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="bar"><strong id="sheet-title"></strong><button type="button" id="done">close</button></div>
  <div id="stage"><div class="tool" id="tool"></div></div>
</dialog>

<script src="/tools.js"></script>
<script>
/* a tile opens its tool; close, esc or a tap outside shuts it and stops any sound. */
(function () {
  var sheet = document.getElementById('sheet'), title = document.getElementById('sheet-title'), el = document.getElementById('tool');
  var rows = [].slice.call(document.querySelectorAll('[data-tool]')), cleanup = null, from = null;
  var tools = window.TOOLS || {};
  function unmount() { if (cleanup) { try { cleanup(); } catch (_) {} cleanup = null; } el.innerHTML = ''; }
  function open(btn) {
    var id = btn.getAttribute('data-tool'); if (!tools[id]) return;
    unmount(); from = btn; title.textContent = btn.getAttribute('data-name');
    if (sheet.showModal) { if (!sheet.open) sheet.showModal(); } else sheet.setAttribute('open', '');
    cleanup = tools[id](el) || null;
    try { history.replaceState(null, '', '#' + id); } catch (_) {}
  }
  function close() { if (sheet.close && sheet.open) sheet.close(); else { sheet.removeAttribute('open'); closed(); } }
  function closed() {
    if (sheet.open) return;   /* another tool was opened before the close event arrived */
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    unmount(); try { history.replaceState(null, '', location.pathname); } catch (_) {}
    if (from) from.focus();
  }
  rows.forEach(function (b) { b.addEventListener('click', function () { open(b); }); });
  document.getElementById('done').addEventListener('click', close);
  sheet.addEventListener('close', closed);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) close(); });
  var want = location.hash.slice(1), row = want && document.querySelector('[data-tool="' + want.replace(/[^a-z]/g, '') + '"]');
  if (row) open(row);
})();
</script>
</body>
</html>
